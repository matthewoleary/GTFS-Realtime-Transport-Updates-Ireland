services:
    mysqldb:
        container_name: mysql-tfi-db
        image: mysql
        restart: always
        environment:
            MYSQL_USER: ${DOCKER_SQL_USER}
            MYSQL_PASSWORD: ${DOCKER_SQL_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DOCKER_SQL_PASSWORD}
            MYSQL_DATABASE: ${DOCKER_SQL_DATABASE}
        ports:
            - '3306:3306'
        volumes:
            - mysql-tfi-data:/var/lib/mysql

volumes:
    mysql-tfi-data: