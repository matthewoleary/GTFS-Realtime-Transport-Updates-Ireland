openapi: 3.0.3
info:
  title: Realtime Transport Updates API
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/license/mit
  description: |
    Node.js API for Irish GTFS schedule and real-time public transport updates. Provides endpoints for agencies, routes, stops, trips, shapes, and more, with robust cache/DB fallback and real-time GTFS-R integration.

    The following fields are only included when GTFS-realtime data is available for the requested trip or stop:

    - `realtime_arrival_timestamp`,
    - `realtime_departure_timestamp`,
    - `unwrapped_arrival_timestamp`,
    - `unwrapped_departure_timestamp`,
    - `tripUpdate`,
    - `stopUpdate`,
    - `stopTimeUpdate`
    - `vehicle`

    On vehicle-enriched endpoints, the vehicle field is always present and nullable, with a null value when no matching realtime vehicle position update exists for the trip.
security: []
servers:
  - url: http://localhost:3000
    description: Local development server
paths:
  /api/agencies:
    get:
      operationId: getAllAgencies
      summary: List all agencies
      responses:
        '200':
          description: List of agencies
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_timestamp:
                    type: integer
                  db_last_updated:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp when the static GTFS database data was last updated.
                  response:
                    type: array
                    items:
                      type: object
                      properties:
                        agency_id:
                          type: string
                          description: Unique agency identifier
                        agency_name:
                          type: string
                          description: Agency name
                        agency_url:
                          type: string
                          description: Agency website URL
                        agency_timezone:
                          type: string
                          description: Agency timezone
                        agency_lang:
                          type: string
                          description: Agency language
                          nullable: true
                        agency_phone:
                          type: string
                          description: Agency phone number
                          nullable: true
                        agency_fare_url:
                          type: string
                          description: Agency fare URL
                          nullable: true
                        agency_email:
                          type: string
                          description: Agency email
                          nullable: true
        '404':
          description: No agencies found
        '500':
          description: Internal Server Error
  /api/agencies/{agencyId}:
    get:
      operationId: getAgencyById
      summary: Get details for a specific agency
      parameters:
        - in: path
          name: agencyId
          required: true
          schema:
            type: string
          description: Agency ID
      responses:
        '200':
          description: Agency details
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_timestamp:
                    type: integer
                  db_last_updated:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp when the static GTFS database data was last updated.
                  response:
                    type: object
                    properties:
                      agency_id:
                        type: string
                        description: Agency ID
                      agency_name:
                        type: string
                        description: Agency name
                      agency_url:
                        type: string
                        description: Agency website URL
                      agency_timezone:
                        type: string
                        description: Agency timezone
        '404':
          description: Agency not found
        '500':
          description: Internal Server Error
  /api/routes:
    get:
      operationId: getAllRoutes
      summary: List all routes
      parameters:
        - in: query
          name: agencyId
          schema:
            type: string
          required: false
          description: Agency ID to filter routes
      responses:
        '200':
          description: List of routes
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_timestamp:
                    type: integer
                  db_last_updated:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp when the static GTFS database data was last updated.
                  response:
                    type: array
                    items:
                      type: object
                      properties:
                        route_id:
                          type: string
                          description: Unique route identifier
                        agency_id:
                          type: string
                          description: Agency ID for the route
                        agency_name:
                          type: string
                          description: Agency name
                        route_short_name:
                          type: string
                          description: Short name for the route
                          nullable: true
                        route_long_name:
                          type: string
                          description: Long name for the route
                          nullable: true
                        route_desc:
                          type: string
                          description: Route description
                          nullable: true
                        route_type:
                          type: integer
                          description: GTFS route type (0-12)
                        route_url:
                          type: string
                          description: Route URL
                          nullable: true
                        route_color:
                          type: string
                          description: Route color (hex RGB)
                          nullable: true
                        route_text_color:
                          type: string
                          description: Route text color (hex RGB)
                          nullable: true
                        route_sort_order:
                          type: integer
                          description: Route sort order
                          nullable: true
                        continuous_pickup:
                          type: integer
                          description: Continuous pickup code (0-3)
                          nullable: true
                        continuous_drop_off:
                          type: integer
                          description: Continuous drop-off code (0-3)
                          nullable: true
        '404':
          description: No routes found
        '500':
          description: Internal Server Error
  /api/routes/{routeId}:
    get:
      operationId: getRouteById
      summary: Get details for a specific route
      parameters:
        - in: path
          name: routeId
          required: true
          schema:
            type: string
          description: Route ID
      responses:
        '200':
          description: Route details
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_timestamp:
                    type: integer
                  db_last_updated:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp when the static GTFS database data was last updated.
                  response:
                    type: object
                    properties:
                      route_id:
                        type: string
                        description: Route ID
                      agency_id:
                        type: string
                        description: Agency ID
                      agency_name:
                        type: string
                        description: Agency name
                      route_short_name:
                        type: string
                        description: Short name for the route
                        nullable: true
                      route_long_name:
                        type: string
                        description: Long name for the route
                        nullable: true
                      route_type:
                        type: integer
                        description: GTFS route type (0-12)
        '404':
          description: Route not found
        '500':
          description: Internal Server Error
  /api/stops:
    get:
      operationId: getAllStops
      summary: List all stops
      parameters:
        - in: query
          name: agencyId
          schema:
            type: string
          required: false
          description: Agency ID to filter stops
      responses:
        '200':
          description: List of stops
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_timestamp:
                    type: integer
                  db_last_updated:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp when the static GTFS database data was last updated.
                  response:
                    type: array
                    items:
                      type: object
                      properties:
                        stop_id:
                          type: string
                          description: Unique stop identifier
                        stop_code:
                          type: string
                          description: Public stop code
                          nullable: true
                        stop_name:
                          type: string
                          description: Stop name
                        tts_stop_name:
                          type: string
                          description: Text-to-speech stop name
                          nullable: true
                        stop_desc:
                          type: string
                          description: Stop description
                          nullable: true
                        stop_lat:
                          type: number
                          format: float
                          description: Latitude
                        stop_lon:
                          type: number
                          format: float
                          description: Longitude
                        zone_id:
                          type: string
                          description: Fare zone ID
                          nullable: true
                        stop_url:
                          type: string
                          description: Stop URL
                          nullable: true
                        location_type:
                          type: integer
                          description: Location type (0-4)
                          nullable: true
                        parent_station:
                          type: string
                          description: Parent station stop_id
                          nullable: true
                        stop_timezone:
                          type: string
                          description: Stop timezone
                          nullable: true
                        wheelchair_boarding:
                          type: integer
                          description: Wheelchair boarding code (0-2)
                          nullable: true
                        level_id:
                          type: string
                          description: Level ID
                          nullable: true
                        platform_code:
                          type: string
                          description: Platform code
                          nullable: true
                        routes:
                          type: array
                          description: Unique routes serving the stop
                          items:
                            type: object
                            properties:
                              route_id:
                                type: string
                                description: Unique route identifier
                              agency_id:
                                type: string
                                description: Agency operating the route
                              route_short_name:
                                type: string
                                description: Short name for the route
                                nullable: true
                              route_long_name:
                                type: string
                                description: Long name for the route
                                nullable: true
                              route_type:
                                type: integer
                                description: GTFS route type
        '404':
          description: No stops found
        '500':
          description: Internal Server Error
  /api/stops/{stopId}:
    get:
      operationId: getStopById
      summary: Get details for a specific stop
      parameters:
        - in: path
          name: stopId
          required: true
          schema:
            type: string
          description: Stop ID
      responses:
        '200':
          description: Stop details
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_timestamp:
                    type: integer
                  db_last_updated:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp when the static GTFS database data was last updated.
                  response:
                    type: object
                    properties:
                      stop_id:
                        type: string
                        description: Stop ID
                      stop_code:
                        type: string
                        description: Public stop code
                        nullable: true
                      stop_name:
                        type: string
                        description: Stop name
                      stop_lat:
                        type: number
                        format: float
                        description: Latitude
                      stop_lon:
                        type: number
                        format: float
                        description: Longitude
                      routes:
                        type: array
                        description: Unique routes serving the stop
                        items:
                          type: object
                          properties:
                            route_id:
                              type: string
                              description: Unique route identifier
                            agency_id:
                              type: string
                              description: Agency operating the route
                            route_short_name:
                              type: string
                              description: Short name for the route
                              nullable: true
                            route_long_name:
                              type: string
                              description: Long name for the route
                              nullable: true
                            route_type:
                              type: integer
                              description: GTFS route type
        '404':
          description: Stop not found
        '500':
          description: Internal Server Error
  /api/trips/{tripId}:
    get:
      operationId: getTripById
      summary: Get details for a specific trip
      parameters:
        - in: path
          name: tripId
          required: true
          schema:
            type: string
          description: Trip ID
      responses:
        '200':
          description: Trip details
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_timestamp:
                    type: integer
                  db_last_updated:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp when the static GTFS database data was last updated.
                  realtime_trip_updates_feed_timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp for the realtime trip updates feed used to enrich the response.
                  realtime_vehicle_positions_feed_timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp for the realtime vehicle positions feed used to enrich the response.
                  response:
                    type: object
                    properties:
                      trip_id:
                        type: string
                        description: Trip ID
                      route_id:
                        type: string
                        description: Route ID
                      service_id:
                        type: string
                        description: Service ID
                      trip_headsign:
                        type: string
                        description: Trip headsign
                        nullable: true
                      trip_short_name:
                        type: string
                        description: Trip short name
                        nullable: true
                      direction_id:
                        type: integer
                        description: Direction ID (0 or 1)
                        nullable: true
                      block_id:
                        type: string
                        description: Block ID
                        nullable: true
                      shape_id:
                        type: string
                        description: Shape ID
                        nullable: true
                      realtime_vehicle:
                        type: object
                        nullable: true
                        description: GTFS-realtime vehicle position data without the duplicate trip descriptor. This field is null when no matching vehicle update exists.
                      tripUpdate:
                        type: object
                        nullable: true
                        description: GTFS-realtime trip update data attached when realtime updates are available.
                        properties:
                          trip:
                            type: object
                            properties:
                              tripId:
                                type: string
                                nullable: true
                              scheduleRelationship:
                                type: string
                                enum: [SCHEDULED, ADDED, UNSCHEDULED, CANCELED, REPLACEMENT, DUPLICATED, DELETED]
                                nullable: true
                          stopTimeUpdate:
                            type: array
                            items:
                              type: object
                              properties:
                                stopSequence:
                                  type: integer
                                  nullable: true
                                stopId:
                                  type: string
                                  nullable: true
                                scheduleRelationship:
                                  type: string
                                  enum: [SCHEDULED, SKIPPED, NO_DATA, UNSCHEDULED]
                                  nullable: true
                                departure:
                                  type: object
                                  properties:
                                    delay:
                                      type: integer
                                      nullable: true
                                arrival:
                                  type: object
                                  properties:
                                    delay:
                                      type: integer
                                      nullable: true
        '404':
          description: Trip not found
        '500':
          description: Internal Server Error
  /api/shapes/{shapeId}:
    get:
      operationId: getShapeById
      summary: Get details for a specific shape
      parameters:
        - in: path
          name: shapeId
          required: true
          schema:
            type: string
          description: Shape ID
      responses:
        '200':
          description: Shape details
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_timestamp:
                    type: integer
                  db_last_updated:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp when the static GTFS database data was last updated.
                  response:
                    type: array
                    items:
                      type: object
                      properties:
                        shape_id:
                          type: string
                          description: Shape ID
                        shape_pt_lat:
                          type: number
                          format: float
                          description: Latitude of shape point
                        shape_pt_lon:
                          type: number
                          format: float
                          description: Longitude of shape point
                        shape_pt_sequence:
                          type: integer
                          description: Sequence of the point along the shape
                        shape_dist_traveled:
                          type: number
                          format: float
                          description: Distance traveled along the shape (optional, may be null)
        '404':
          description: Shape not found
        '500':
          description: Internal Server Error
  /api/stops/{stopId}/trips:
    get:
      operationId: getTripsAtStop
      summary: Get incoming trips at a stop (with real-time updates)
      parameters:
        - in: path
          name: stopId
          required: true
          schema:
            type: string
          description: The stop ID to query for incoming trips.
        - in: query
          name: lowerBoundMinutes
          schema:
            type: integer
          required: false
          description: The lower bound in minutes for filtering incoming trips. Trips departing this many minutes before now will be included in the response.
        - in: query
          name: upperBoundMinutes
          schema:
            type: integer
          required: false
          description: The upper bound in minutes for filtering incoming trips. Trips departing within this many minutes from now will be included in the response.
      responses:
        '200':
          description: Incoming trips at stop
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_timestamp:
                    type: integer
                  db_last_updated:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp when the static GTFS database data was last updated.
                  realtime_trip_updates_feed_timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp for the realtime trip updates feed used to enrich the response.
                  realtime_vehicle_positions_feed_timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp for the realtime vehicle positions feed used to enrich the response.
                  response:
                    type: array
                    items:
                      type: object
                      properties:
                        trip_id:
                          type: string
                          description: Trip ID
                        trip_headsign:
                          type: string
                          description: Trip headsign
                        route_id:
                          type: string
                          description: Route ID
                        route_short_name:
                          type: string
                          description: Route short name
                        route_long_name:
                          type: string
                          description: Route long name
                        agency_id:
                          type: string
                          description: Agency ID
                        stop_id:
                          type: string
                          description: Stop ID
                        arrival_time:
                          type: string
                          description: Scheduled arrival time (HH:MM:SS)
                        arrival_timestamp:
                          type: integer
                          description: Arrival time as Unix timestamp (seconds)
                        departure_time:
                          type: string
                          description: Scheduled departure time (HH:MM:SS)
                        departure_timestamp:
                          type: integer
                          description: Departure time as Unix timestamp (seconds)
                        stop_sequence:
                          type: integer
                          description: Sequence of the stop along the trip
                        service_id:
                          type: string
                          description: Service ID
                        direction_id:
                          type: integer
                          description: Direction ID (0 or 1)
                          nullable: true
                        shape_id:
                          type: string
                          description: Shape ID
                          nullable: true
                        realtime_arrival_timestamp:
                          type: integer
                          nullable: true
                          description: Real-time arrival timestamp when a stop-time update is applied.
                        realtime_arrival_time:
                          type: string
                          nullable: true
                          description: Real-time arrival time formatted as HH:MM:SS.
                        realtime_departure_timestamp:
                          type: integer
                          nullable: true
                          description: Real-time departure timestamp when a stop-time update is applied.
                        realtime_departure_time:
                          type: string
                          nullable: true
                          description: Real-time departure time formatted as HH:MM:SS.
                        realtime_source:
                          type: string
                          enum: [DIRECT, PROPAGATED]
                          nullable: true
                          description: Whether realtime timestamps came from this stop or were propagated from an earlier update.
                        unwrapped_arrival_timestamp:
                          type: integer
                          nullable: true
                          description: Unwrapped arrival timestamp for services that cross midnight.
                        unwrapped_arrival_time:
                          type: string
                          nullable: true
                          description: Unwrapped arrival time formatted as HH:MM:SS.
                        unwrapped_departure_timestamp:
                          type: integer
                          nullable: true
                          description: Unwrapped departure timestamp for services that cross midnight.
                        unwrapped_departure_time:
                          type: string
                          nullable: true
                          description: Unwrapped departure time formatted as HH:MM:SS.
                        realtime_vehicle:
                          type: object
                          nullable: true
                          description: GTFS-realtime vehicle position data without the duplicate trip descriptor. This field is null when no matching vehicle update exists.
                        tripUpdate:
                          type: object
                          nullable: true
                          description: GTFS-realtime trip update data attached for the trip.
                          properties:
                            trip:
                              type: object
                              properties:
                                tripId:
                                  type: string
                                  nullable: true
                                scheduleRelationship:
                                  type: string
                                  enum: [SCHEDULED, ADDED, UNSCHEDULED, CANCELED, REPLACEMENT, DUPLICATED, DELETED]
                                  nullable: true
                            timestamp:
                              type: integer
                              nullable: true
                              description: Timestamp of the GTFS-realtime trip update.
                        stopUpdate:
                          type: object
                          nullable: true
                          description: Matching GTFS-realtime stop update for the current stop.
                          properties:
                            stopSequence:
                              type: integer
                              nullable: true
                            stopId:
                              type: string
                              nullable: true
                            scheduleRelationship:
                              type: string
                              enum: [SCHEDULED, SKIPPED, NO_DATA, UNSCHEDULED]
                              nullable: true
                            departure:
                              type: object
                              properties:
                                delay:
                                  type: integer
                                  nullable: true
                            arrival:
                              type: object
                              properties:
                                delay:
                                  type: integer
                                  nullable: true
        '404':
          description: No trips found
        '500':
          description: Internal Server Error
  /api/trips/{tripId}/stopTimes:
    get:
      operationId: getStopTimesByTripId
      summary: Get stop times for a specific trip
      parameters:
        - in: path
          name: tripId
          required: true
          schema:
            type: string
          description: Trip ID
      responses:
        '200':
          description: Stop times for trip
          content:
            application/json:
              schema:
                type: object
                properties:
                  query_timestamp:
                    type: integer
                  db_last_updated:
                    type: string
                    format: date-time
                    nullable: true
                    description: Timestamp when the static GTFS database data was last updated.
                  realtime_trip_updates_feed_timestamp:
                    type: integer
                    nullable: true
                    description: Timestamp for the realtime trip updates feed used to enrich the response.
                  response:
                    type: array
                    items:
                      type: object
                      properties:
                        trip_id:
                          type: string
                          description: Trip ID
                        arrival_time:
                          type: string
                          description: Scheduled arrival time (HH:MM:SS)
                        arrival_timestamp:
                          type: integer
                          description: Arrival time as Unix timestamp (seconds)
                        departure_time:
                          type: string
                          description: Scheduled departure time (HH:MM:SS)
                        departure_timestamp:
                          type: integer
                          description: Departure time as Unix timestamp (seconds)
                        realtime_arrival_timestamp:
                          type: integer
                          nullable: true
                          description: Realtime arrival timestamp after applying a direct or propagated update.
                        realtime_departure_timestamp:
                          type: integer
                          nullable: true
                          description: Realtime departure timestamp after applying a direct or propagated update.
                        realtime_source:
                          type: string
                          enum: [DIRECT, PROPAGATED]
                          nullable: true
                          description: Whether realtime timestamps came from this stop or were propagated from an earlier update.
                        stop_id:
                          type: string
                          description: Stop ID
                        stop_code:
                          type: string
                          nullable: true
                          description: Public stop code
                        stop_name:
                          type: string
                          description: Stop name
                        stop_lat:
                          type: number
                          format: float
                          description: Latitude
                        stop_lon:
                          type: number
                          format: float
                          description: Longitude
                        stop_sequence:
                          type: integer
                          description: Sequence of the stop along the trip
                        stop_headsign:
                          type: string
                          description: Stop headsign
                          nullable: true
                        pickup_type:
                          type: integer
                          description: Pickup type (0-3)
                          nullable: true
                        drop_off_type:
                          type: integer
                          description: Drop-off type (0-3)
                          nullable: true
                        timepoint:
                          type: integer
                          description: Timepoint (0 or 1)
                          nullable: true
                        stopTimeUpdate:
                          type: object
                          nullable: true
                          description: Matching GTFS-realtime stop time update attached when realtime updates are available.
                          properties:
                            stopSequence:
                              type: integer
                              nullable: true
                            stopId:
                              type: string
                              nullable: true
                            scheduleRelationship:
                              type: string
                              enum: [SCHEDULED, SKIPPED, NO_DATA, UNSCHEDULED]
                              nullable: true
                            departure:
                              type: object
                              properties:
                                delay:
                                  type: integer
                                  nullable: true
                            arrival:
                              type: object
                              properties:
                                delay:
                                  type: integer
                                  nullable: true
        '404':
          description: No stop times found
        '500':
          description: Internal Server Error
